# FOOM build config. Paths are relative to this file.
iwad   = "iwads/freedoom2.wad"   # or your own DOOM2.WAD / DOOM.WAD
output = "build/foom.pk3"

scale      = 2        # photo resolution multiplier (1 = chunky 1993 pixels, 2-4 = sharper)
background = "oval"   # "oval" cutout, "none" (keep rectangle), or "remove" (AI cutout, needs: pip install rembg)
item_size  = 1.4      # how much bigger than the original pickup sprite a face should be

# Everything below points at labelled placeholders (regenerate with make_placeholders.py).
# Swap in real photos as you go. Use a plain path, or a table for per-photo options:
#   Imp = { photo = "friends/sam.jpg", crop = [x, y, width, height], background = "none" }
# Delete a line to keep the original Doom sprite.

[monsters]
ZombieMan        = "friends/placeholders/ZombieMan.png"
ShotgunGuy       = "friends/placeholders/ShotgunGuy.png"
